# micpython 的打包元数据（零运行时依赖、零自定义构建钩子）。
#
# 在仓库根可直接导入，也可执行 python -m pip install ./micpython。
# 包源码在 pyproject.toml 所在目录。动态库独立构建，安装后通过 MIC_FFI_LIB 指定。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micpython"
version = "1.0.0"
description = "gurobipy 风格的 milp 求解器 Python 绑定（ctypes + milp-ffi，零第三方依赖）"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[tool.setuptools]
packages = ["micpython", "micpython.planner"]

[tool.setuptools.package-dir]
micpython = "."
