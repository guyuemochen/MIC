[package]
name = "milp"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["sparse_row_products"]
# 诊断计时完全独立于求解决策，默认不编译。
sparse_profile = []
# 受影响行累加通过独立配对门槛，默认开启；诊断访问计数仍单独编译。
sparse_row_products = []
sparse_row_products_stats = ["sparse_row_products"]

# 真实生产路径的证明进展诊断，默认不编译。
proof_profile = []

# 根预割启发式后恢复完整最优基快照，默认关闭的性能试验。
root_snapshot_restore = []
