[package]
name = "milp"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["sparse_row_products", "binary_coefficient_strengthening", "root_cut_recheck"]
# 诊断计时完全独立于求解决策，默认不编译。
sparse_profile = []
# 受影响行累加通过独立配对门槛，默认开启；诊断访问计数仍单独编译。
sparse_row_products = []
sparse_row_products_stats = ["sparse_row_products"]

# 真实生产路径的证明进展诊断，默认不编译。
proof_profile = []

# 根割小批收敛后复核尚未施加候选的违反度，通过独立配对门槛，默认开启。
root_cut_recheck = []

# 二元互斥结合短行活动度固定，默认关闭的预处理试验。
binary_mutex_row_fixing = []

# 根预割启发式后恢复完整最优基快照，默认关闭的性能试验。
root_snapshot_restore = []

# 根启发式共享LP工作上限，默认关闭的性能试验。
root_heuristic_work_budget = []

# 根启发式单次resolve严格按换基/界翻转工作步扣费，默认关闭。
root_heuristic_work_limit = ["root_heuristic_work_budget"]

# 完整预处理后仅加强负二元系数，通过独立证明性能门槛，默认开启。
binary_coefficient_strengthening = []

# 强化行无法精确认证时回退到同一缩减列空间中的旧认证行，默认关闭。
certified_row_fallback = ["binary_coefficient_strengthening"]

# 风险主元换基前重构旧基并整轮重选，默认关闭的数值稳定性试验。
risk_pivot_refresh = []

# 稀疏冷启动第一阶段在有限主元分解失败后，有界重建一次并复核风险主元。
sparse_phase1_recovery = []

# 首次LU失败的基/换基证据捕获；只供显式诊断，不改变算法和默认路径。
lu_failure_diagnostics = []

# 首个实际第一阶段的有界只读诊断，默认不编译。
phase1_progress_diagnostics = []

[[example]]
name = "lu_failure_probe"
required-features = ["lu_failure_diagnostics"]

[[example]]
name = "phase1_progress_probe"
required-features = ["phase1_progress_diagnostics"]
